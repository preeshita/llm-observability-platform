apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-app-config
data:
  LANGFUSE_BASE_URL: "https://us.cloud.langfuse.com"
  PYTHONUNBUFFERED: "1"
  APP_ENV: "production"
  LLM_PROVIDER: "ollama"
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  OLLAMA_MODEL: "llama3.2:3b"
  OLLAMA_TIMEOUT_SECONDS: "120"