
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 1m

    route:
      receiver: local-webhook
      group_by:
        - alertname
        - namespace
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h

    receivers:
      - name: local-webhook
        webhook_configs:
          - url: http://alert-receiver.monitoring.svc.cluster.local:5001/alerts
            send_resolved: true
