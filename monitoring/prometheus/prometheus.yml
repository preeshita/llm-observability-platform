global:
  scrape_interval: 5s

scrape_configs:
  # Existing Docker Compose application
  - job_name: "llm-observability"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]

  # Kubernetes Pod 1
  - job_name: "llm-kubernetes-pods"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "10.1.0.7:8000"
          - "10.1.0.10:8000"

  # Kubernetes cluster state metrics
  - job_name: "kube-state-metrics"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8082"]